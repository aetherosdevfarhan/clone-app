name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          gradle assembleDebug --console=plain > build.log 2>&1 || {
            echo "----- javac errors (full list) -----"
            grep -E "^/.*\.java:[0-9]+: error:" build.log || echo "(no javac error: lines matched - see build.log artifact)"
            echo "-------------------------------------"
            grep -E "^/.*\.java:[0-9]+: error:" build.log | while IFS= read -r l; do
              echo "::error::$l"
            done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
